[pytest]
pythonpath = code tests
testpaths = tests
markers =
    llm: calls the real OpenAI API (costs money); run with `pytest -m llm`
    postgres: requires NABD_TEST_DATABASE_URL pointing to a disposable database ending in _test
addopts = -m "not llm"
filterwarnings =
    ignore::DeprecationWarning:langsmith.*
