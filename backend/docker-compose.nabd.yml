name: nabd

x-runtime: &runtime
  image: nabd-backend:phase7
  build:
    context: .
    dockerfile: Dockerfile.text
    target: runtime
  # Salesforce, OpenAI and both MCP context secrets come from the Git-ignored .env.nabd;
  # the values under `environment` override its local (127.0.0.1) addresses.
  env_file:
    - path: .env.nabd
      required: false
  environment:
    NABD_DATABASE_URL: postgresql://nabd:nabd_dev@db:5432/nabd
    NABD_READ_MCP_URL: http://read-mcp:8091/mcp
    NABD_WRITE_MCP_URL: http://write-mcp:8092/mcp

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nabd
      POSTGRES_PASSWORD: nabd_dev
      POSTGRES_DB: nabd
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - nabd_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabd -d nabd"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *runtime
    command: ["python", "-m", "nabd", "migrate"]
    depends_on:
      db:
        condition: service_healthy

  read-mcp:
    <<: *runtime
    command: ["python", "-m", "nabd", "read-mcp", "serve"]
    environment:
      NABD_READ_MCP_HOST: 0.0.0.0
      NABD_READ_MCP_URL: http://read-mcp:8091/mcp
      NABD_READ_MCP_ALLOWED_HOSTS: read-mcp:8091,127.0.0.1:8091,localhost:8091
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12

  write-mcp:
    <<: *runtime
    command: ["python", "-m", "nabd", "write-mcp", "serve"]
    environment:
      NABD_WRITE_MCP_HOST: 0.0.0.0
      NABD_WRITE_MCP_URL: http://write-mcp:8092/mcp
      NABD_WRITE_MCP_ALLOWED_HOSTS: write-mcp:8092,127.0.0.1:8092,localhost:8092
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/healthz', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    <<: *runtime
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      read-mcp:
        condition: service_healthy
      write-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 12

  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nabd
      POSTGRES_PASSWORD: nabd_test
      POSTGRES_DB: nabd_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabd -d nabd_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.text
      target: tests
    environment:
      NABD_TEST_DATABASE_URL: postgresql://nabd:nabd_test@test-db:5432/nabd_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  nabd_postgres:
